# ## Hard dataset configuration

name: moons
n_classes: 2
dir_plots: ./results/plots/moons_plots/hard/ # Check

n_train: 20000
n_test: 5000

noise_moons: 0.15 # Noise level for the moons dataset

n_annotators: 20 # Number of annotators
annotations_percentage: 0.2 # Percentage of points annotated by each annotator
annotator_prec: "[0.9] * 1 + [0.85] * 2 + [0.75]* 3 + [0.7] * 10 + [0.6] * 4"
annotator_behaviour: "['class_0'] + ['spammer']*2 + ['adversarial']*2 + ['class_1']" 
annotator_region: "[(0,1*np.pi)] + [(1*np.pi, 2*np.pi)]"
#"[(0, 0.6*np.pi)] + [(0.25*np.pi, 1*np.pi)] + [(1.25*np.pi, 2*np.pi)] + [(1*np.pi, 1.5*np.pi)] + [(1*np.pi, 2*np.pi)] + [(1.5*np.pi, 2.25*np.pi)]"

seed: 42


